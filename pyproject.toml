 # Specify the build system.
[build-system]
requires = ["sip", "PyQt-builder"]
build-backend = "sipbuild.api"

# Specify the PEP 566 metadata for the project.
[project]
name = "PyQGLViewer"
version = "1.3.0"
description = "Python bindings for the libQGViewer widget"
authors = [
    { name = "Frederic Boudon", email = "frederic.boudon@cirad.fr" }
]
#description-file = "README"
dependencies = ["PyQt6"]

[tool.sip.bindings.PyQGLViewer]
qmake-QT = ['xml opengl gui widgets openglwidgets']
libraries = ['QGLViewer-qt6']
tags = ['QGLViewer_2_9_1']
include-dirs=['${CONDA_PREFIX}/include']
library-dirs=['${CONDA_PREFIX}/lib']
#extra-compile-args=['-I${CONDA_PREFIX}/include']
#extra-link-args=['-L${CONDA_PREFIX}/lib']


[tool.sip.project]
sip-module="PyQt6.sip"

